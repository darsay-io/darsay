[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "darsay"
version = "0.8.0"
description = "Download, archive, and curate full model ecosystems as reproducible, auditable bundles"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jeremy Norris" }]
keywords = [
    "huggingface",
    "archive",
    "models",
    "datasets",
    "reproducibility",
    "curation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving",
]
dependencies = [
    # 1.23 exposes separate network-byte progress for honest transfer budgets.
    "huggingface_hub>=1.23",
]

[project.optional-dependencies]
# Faster secondary hash recorded alongside SHA-256
fast-hash = ["blake3"]
# Tokenizer round-trip smoke test without pulling in torch
smoke = ["tokenizers"]
# Full inference smoke test
inference = ["transformers", "torch"]
# Measured parquet row counts for dataset bundles (declared counts need nothing)
datasets = ["pyarrow"]
# Test suite (unit + integration; e2e needs only the core Hub client)
# plus Ruff for lint + format
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/darsay-io/darsay"
Documentation = "https://github.com/darsay-io/darsay/blob/main/docs/README.md"
Issues = "https://github.com/darsay-io/darsay/issues"
Changelog = "https://github.com/darsay-io/darsay/blob/main/CHANGELOG.md"

[project.scripts]
darsay = "darsay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-q",
]
markers = [
    "unit: isolated unit tests (no network)",
    "integration: multi-module tests with a fake provider (no network)",
    "e2e: live network tests against Hugging Face Hub",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
xfail_strict = true

[tool.coverage.run]
source = ["darsay"]
branch = true
omit = ["*/darsay/runners/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
src = ["src"]
extend-exclude = ["vault", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    # Formatter is the source of truth for wrapping; leftover long
    # strings / URLs are not worth fighting.
    "E501",
    # Explicit if/else and early-return guards are the house style.
    "SIM103",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["darsay", "tests"]
