name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Check tag matches the built artifacts
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          # Check the files we are about to publish, not a source file that
          # could disagree with them.
          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          built = sorted(p.name for p in Path("dist").iterdir())
          want = [f"darsay-{expected}-py3-none-any.whl", f"darsay-{expected}.tar.gz"]
          missing = [n for n in want if n not in built]
          if missing:
              raise SystemExit(f"tag {tag!r} expected {missing}, dist/ has {built}")
          print(f"tag {tag} matches {built}")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Nudge the website docs sync
        # Fires darsay.io's "Sync CLI docs" workflow so the docs pin lands
        # minutes after the release instead of at its hourly cron. Needs the
        # WEBSITE_DISPATCH_TOKEN secret (fine-grained PAT with Actions
        # read/write on darsay-io/website). Without the secret, or on any
        # failure, the cron still picks the release up — never fail the
        # release over it.
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set; the hourly cron will sync instead"
            exit 0
          fi
          gh workflow run sync-cli-docs.yml -R darsay-io/website -f tag="$GITHUB_REF_NAME" \
            || echo "dispatch failed; the hourly cron will sync instead"
