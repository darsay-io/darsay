name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit and integration tests
        run: |
          python -m pytest -m "not e2e" \
            --cov=modelvault \
            --cov-report=term-missing \
            --cov-fail-under=65

      - name: CLI smoke
        run: |
          modelvault --version
          modelvault --help

  e2e:
    name: E2E (Hugging Face Hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache Hub downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-gpt2-${{ runner.os }}
          restore-keys: hf-tiny-gpt2-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Live Hub path
        env:
          HF_HUB_DISABLE_XET: "1"
          MODELVAULT_E2E: "1"
        run: python -m pytest -m e2e --run-e2e
        timeout-minutes: 15

  build:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install from wheel in a clean env
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/modelvault --version
          /tmp/wheel-env/bin/python - <<'PY'
          from pathlib import Path
          import modelvault
          from modelvault.hydrate import ENGINES

          root = Path(modelvault.__file__).parent / "runners"
          missing = [spec["runner"] for spec in ENGINES.values()
                     if not (root / spec["runner"]).is_file()]
          if missing:
              raise SystemExit(f"wheel is missing runners: {missing}")
          print("wheel ok:", Path(modelvault.__file__).parent)
          PY
