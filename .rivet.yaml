api_version: rivet/v1alpha1

compatibility:
  minimum_rivet_version: v0.4.172

upstreams:
  ruff-stable:
    uses: pypi.release.latest
    project: ruff
    ordering: pep440
    channel: stable

updates:
  python-tools:
    description: Advance Darsay's explicitly supported Python development-tool floors.
    pins:
      - id: ruff-minimum
        upstream: ruff-stable
        targets:
          - uses: python.requirement
            path: pyproject.toml
            pointer: /project/optional-dependencies/dev
            name: ruff

ci:
  github:
    source_workflow: {}
    release_jobs:
      jobs: [release]

releases:
  darsay:
    description: Prepare and publish the Darsay Python package.
    source:
      unpublished_branch: require_land
    version:
      uses: semver
      initial: v0.1.0
    tags:
      - id: release
        primary: true
    prepare:
      actions:
        - id: release-files
          run:
            - ./scripts/release.py
            - "${release.version.bare}"
            - --prepare-only
            - --metadata-only
          writes:
            - CHANGELOG.md
            - docs/README.md
            - src/darsay/__init__.py
      commit:
        message: |
          release: ${release.version.bare}
      verify:
        run:
          - ./scripts/release.py
          - "${release.version.bare}"
          - --check
          - --metadata-only

land:
  description: Normalize and land the attached local commit chain.
  normalize:
    messages:
      - uses: commit.message.decode_escaped_newlines
      - uses: commit.message.remove_trailer
        with:
          key: Co-Authored-By
          value_match: '(?i).*claude.*'
      - uses: commit.message.remove_trailer
        with:
          key: Claude-Session
          value_match: '.*'
  worktree:
    dirty_tracked: prompt_stash
    evidence:
      exclude_ignored:
        - .pytest_cache
        - .venv
        - build
        - dist
  push:
    strategy: one_by_one
    hooks: final
    after_each:
      ci: registered
